<style>
        /* CRT Scanline Effect */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0) 50%,
                rgba(168, 85, 247, 0.05) 50%,
                rgba(168, 85, 247, 0.05)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
        }

        /* Particle Float Animation */
        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
        .particle {
            animation: float-up 10s infinite linear;
            background-color: #A855F7;
            box-shadow: 0 0 8px #A855F7;
        }

        /* Torn Paper Edge Simulation */
        .torn-paper {
            clip-path: polygon(
                0% 2%, 2% 0%, 98% 1%, 100% 3%, 
                99% 97%, 97% 100%, 3% 98%, 0% 99%
            );
        }
        
        /* Deep Glow for Frame */
        .deep-glow {
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3), inset 0 0 20px rgba(168, 85, 247, 0.2);
        }
        
        /* Text Ink Drip Texture Simulation via Text Shadow */
        .text-drip {
            text-shadow: 0px 4px 0px rgba(168,85,247,0.4), 0px 8px 0px rgba(168,85,247,0.1);
        }
    </style>
