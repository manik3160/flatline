<style>
        .glow-jugaad {
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4), inset 0 0 10px rgba(255, 215, 0, 0.2);
        }
        .text-glow-jugaad {
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #FFD700;
            opacity: 0;
            animation: fall linear infinite;
        }
        .confetti.diamond {
            transform: rotate(45deg);
        }
        .confetti.plus {
            background-color: transparent;
        }
        .confetti.plus::before, .confetti.plus::after {
            content: '';
            position: absolute;
            background-color: #FFD700;
        }
        .confetti.plus::before {
            top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-50%);
        }
        .confetti.plus::after {
            left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%);
        }
        @keyframes fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>

<img alt="Confident student character illustration" class="w-full h-full object-cover rounded-full border-4 border-void relative z-10" data-alt="A stylized, high-contrast digital illustration of a confident Indian student character. The character is drawn with bold, thick black outlines and vibrant flat colors, reminiscent of modern expressive comic art. They have a smug, knowing expression, arms crossed, standing against a stark minimalist dark background. The lighting highlights their features dramatically, fitting a tense, clinical-noir aesthetic with a pop of bright gold indicating a 'Jugaad' or clever workaround status. 80s anime meets modern graphic novel style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB3XJYYmeATsjlaEtbRi2MjWG_4cWQ595CXz5Gi5CurLQ7OKc5i4JqmBz6P7RTl7Wb5mK-ZlIFe1jl8-EhfCp3DZzROjVdER_6nGs17d0hDWWRl0NKY1ed3xXPDPw3pVyx26oG0v8xJ_8AxSGr8jEzHkoVGwmJ3YCT2SPJnI508Oy5JJRn2YYy9H6SMgEHYKshy2r3xkZuLL5ZURNSgbVzf_CcXAMhrXsP6SwTFz4rt3dev4WOiiGTIGXQiNaek4mddYR_JPe1DVn0"/>

<!-- Script for Confetti Effect -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('confetti-container');
            const colors = ['#FFD700', '#FFA500', '#FFFFE0'];
            const types = ['diamond', 'plus'];
            const numConfetti = 50;

            for (let i = 0; i < numConfetti; i++) {
                const conf = document.createElement('div');
                const type = types[Math.floor(Math.random() * types.length)];
                conf.classList.add('confetti', type);
                
                conf.style.left = `${Math.random() * 100}vw`;
                conf.style.animationDuration = `${Math.random() * 3 + 2}s`;
                conf.style.animationDelay = `${Math.random() * 5}s`;
                
                if(type === 'diamond') {
                    conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                }
                
                container.appendChild(conf);
            }
        });
    </script>
