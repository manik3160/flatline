<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Scenario Reveal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=DM+Serif+Display&amp;family=Geist+Mono:wght@400;600&amp;family=Bebas+Neue&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#452f2d",
                        "tertiary": "#6bd3fd",
                        "void": "#080808",
                        "elevated": "#1A1A1A",
                        "inverse-on-surface": "#402b29",
                        "on-secondary-fixed": "#1a1c1c",
                        "on-tertiary-fixed": "#001f2a",
                        "background": "#200f0d",
                        "on-secondary-fixed-variant": "#454747",
                        "on-background": "#fedbd6",
                        "secondary-fixed": "#e2e2e2",
                        "error": "#ffb4ab",
                        "surface-container-high": "#392522",
                        "secondary-fixed-dim": "#c6c6c7",
                        "secondary": "#c6c6c7",
                        "on-primary": "#690005",
                        "inverse-primary": "#c00012",
                        "primary-fixed-dim": "#ffb4ab",
                        "border-default": "#242424",
                        "secondary-container": "#454747",
                        "on-primary-container": "#5c0004",
                        "on-error-container": "#ffdad6",
                        "error-container": "#93000a",
                        "surface-tint": "#ffb4ab",
                        "on-error": "#690005",
                        "jugaad": "#FFD700",
                        "outline-variant": "#5e3f3b",
                        "tertiary-container": "#249cc4",
                        "surface-dim": "#200f0d",
                        "barbad": "#F97316",
                        "on-secondary-container": "#b4b5b5",
                        "tertiary-fixed-dim": "#6bd3fd",
                        "surface-container-low": "#291715",
                        "on-surface": "#fedbd6",
                        "surface-variant": "#452f2d",
                        "on-secondary": "#2f3131",
                        "outline": "#ae8783",
                        "primary-container": "#ff544a",
                        "on-surface-variant": "#e8bcb7",
                        "bach-gaya": "#22C55E",
                        "on-tertiary-container": "#002e3d",
                        "inverse-surface": "#fedbd6",
                        "on-primary-fixed": "#410002",
                        "surface-bright": "#4a3431",
                        "primary-fixed": "#ffdad6",
                        "surface-container-lowest": "#1a0a08",
                        "primary": "#ffb4ab",
                        "surface-container": "#2e1b18",
                        "on-primary-fixed-variant": "#93000b",
                        "tertiary-fixed": "#bde9ff",
                        "surface": "#111111",
                        "on-tertiary": "#003546",
                        "on-tertiary-fixed-variant": "#004d64",
                        "antim-sanskar": "#A855F7"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "unit": "4px",
                        "gutter": "16px",
                        "margin-mobile": "16px",
                        "margin-desktop": "48px"
                    },
                    "fontFamily": {
                        "body-base": ["Plus Jakarta Sans"],
                        "scenario-text": ["DM Serif Display"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "verdict-lg": ["Bebas Neue"],
                        "timer-mono": ["Geist Mono"],
                        "display-xl": ["Bebas Neue"]
                    },
                    "fontSize": {
                        "body-base": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "scenario-text": ["24px", {"lineHeight": "32px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                        "verdict-lg": ["48px", {"lineHeight": "48px", "fontWeight": "400"}],
                        "timer-mono": ["32px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "display-xl": ["72px", {"lineHeight": "72px", "letterSpacing": "0.05em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
<style>
        .progress-bar-animation {
            animation: progress 4s linear forwards;
        }
        @keyframes progress {
            0% { width: 100%; }
            100% { width: 0%; }
        }
        .pulse-text {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-void text-on-surface h-screen w-screen overflow-hidden flex flex-col justify-between selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Status Section -->
<header class="w-full pt-gutter px-gutter md:px-margin-desktop flex flex-col items-center">
<div class="flex justify-between w-full max-w-4xl mb-4">
<div class="font-timer-mono text-timer-mono text-on-surface-variant text-sm tracking-widest uppercase">
                ROUND 2 OF 5
            </div>
<div class="font-timer-mono text-timer-mono text-tertiary text-sm tracking-widest uppercase">
                [Category: Survival]
            </div>
</div>
<!-- The EKG Line / Progress Bar -->
<div class="w-full max-w-4xl h-[2px] bg-surface-container-highest relative overflow-hidden">
<div class="absolute top-0 right-0 h-full bg-primary-container progress-bar-animation shadow-[0_0_10px_rgba(255,84,74,0.8)]"></div>
</div>
</header>
<!-- Main Scenario Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop z-10 relative">
<div class="max-w-3xl text-center space-y-8">
<p class="font-scenario-text text-scenario-text md:text-5xl md:leading-tight text-white drop-shadow-lg">
                "You are stuck in a lift with your ex and a swarm of bees. Your only tool is a single paratha."
            </p>
<p class="font-body-base text-body-base text-on-surface-variant italic pulse-text mt-8 opacity-70">
                A twist is coming...
            </p>
</div>
</main>
<!-- Bottom Countdown -->
<footer class="w-full pb-margin-desktop px-gutter flex justify-center items-end">
<div class="flex flex-col items-center gap-2">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">
                Answering starts in
            </span>
<div class="font-timer-mono text-timer-mono text-primary text-5xl md:text-7xl drop-shadow-[0_0_15px_rgba(255,180,171,0.5)] flex items-center gap-4">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">timer</span>
<span id="countdown">4</span><span class="text-3xl text-primary-fixed-dim">.00</span>
</div>
</div>
</footer>
<!-- Subtle Background Elements -->
<div class="absolute inset-0 pointer-events-none opacity-20 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-surface-container-high via-void to-void z-0"></div>
<script>
        // Simple countdown interaction script
        let count = 4;
        const countdownEl = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            count--;
            if(count > 0) {
                countdownEl.innerText = count;
            } else {
                countdownEl.innerText = 0;
                clearInterval(timer);
                // Trigger next state logic here
            }
        }, 1000);
    </script>
</body></html>
