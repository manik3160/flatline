<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FLATLINE - Answering</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=DM+Serif+Display&amp;family=Bebas+Neue&amp;family=Geist+Mono:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#452f2d",
                        "tertiary": "#6bd3fd",
                        "void": "#080808",
                        "elevated": "#1A1A1A",
                        "inverse-on-surface": "#402b29",
                        "on-secondary-fixed": "#1a1c1c",
                        "on-tertiary-fixed": "#001f2a",
                        "background": "#200f0d",
                        "on-secondary-fixed-variant": "#454747",
                        "on-background": "#fedbd6",
                        "secondary-fixed": "#e2e2e2",
                        "error": "#ffb4ab",
                        "surface-container-high": "#392522",
                        "secondary-fixed-dim": "#c6c6c7",
                        "secondary": "#c6c6c7",
                        "on-primary": "#690005",
                        "inverse-primary": "#c00012",
                        "primary-fixed-dim": "#ffb4ab",
                        "border-default": "#242424",
                        "secondary-container": "#454747",
                        "on-primary-container": "#5c0004",
                        "on-error-container": "#ffdad6",
                        "error-container": "#93000a",
                        "surface-tint": "#ffb4ab",
                        "on-error": "#690005",
                        "jugaad": "#FFD700",
                        "outline-variant": "#5e3f3b",
                        "tertiary-container": "#249cc4",
                        "surface-dim": "#200f0d",
                        "barbad": "#F97316",
                        "on-secondary-container": "#b4b5b5",
                        "tertiary-fixed-dim": "#6bd3fd",
                        "surface-container-low": "#291715",
                        "on-surface": "#fedbd6",
                        "surface-variant": "#452f2d",
                        "on-secondary": "#2f3131",
                        "outline": "#ae8783",
                        "primary-container": "#ff544a",
                        "on-surface-variant": "#e8bcb7",
                        "bach-gaya": "#22C55E",
                        "on-tertiary-container": "#002e3d",
                        "inverse-surface": "#fedbd6",
                        "on-primary-fixed": "#410002",
                        "surface-bright": "#4a3431",
                        "primary-fixed": "#ffdad6",
                        "surface-container-lowest": "#1a0a08",
                        "primary": "#ffb4ab",
                        "surface-container": "#2e1b18",
                        "on-primary-fixed-variant": "#93000b",
                        "tertiary-fixed": "#bde9ff",
                        "surface": "#111111",
                        "on-tertiary": "#003546",
                        "on-tertiary-fixed-variant": "#004d64",
                        "antim-sanskar": "#A855F7"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "unit": "4px",
                        "gutter": "16px",
                        "margin-mobile": "16px",
                        "margin-desktop": "48px"
                    },
                    fontFamily: {
                        "body-base": ["Plus Jakarta Sans"],
                        "scenario-text": ["DM Serif Display"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "verdict-lg": ["Bebas Neue"],
                        "timer-mono": ["Geist Mono"],
                        "display-xl": ["Bebas Neue"]
                    },
                    fontSize: {
                        "body-base": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "scenario-text": ["24px", { lineHeight: "32px", fontWeight: "400" }],
                        "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "600" }],
                        "verdict-lg": ["48px", { lineHeight: "48px", fontWeight: "400" }],
                        "timer-mono": ["32px", { lineHeight: "32px", fontWeight: "600" }],
                        "display-xl": ["72px", { lineHeight: "72px", letterSpacing: "0.05em", fontWeight: "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .border-glow {
            box-shadow: 0 0 15px rgba(255, 84, 74, 0.3);
        }
        .text-glow {
            text-shadow: 0 0 10px rgba(255, 84, 74, 0.8);
        }
        .ekg-bg {
            background-image: radial-gradient(circle at center, rgba(32, 15, 13, 0.8) 0%, rgba(8, 8, 8, 1) 100%),
                              repeating-linear-gradient(0deg, transparent, transparent 19px, rgba(94, 63, 59, 0.1) 20px),
                              repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(94, 63, 59, 0.1) 20px);
        }
        @keyframes pulse-timer {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-fast {
            animation: pulse-timer 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes shrink-bar {
            from { width: 100%; }
            to { width: 0%; }
        }
        .timer-bar-anim {
            animation: shrink-bar 45s linear forwards;
        }
    </style>
</head>
<body class="bg-void text-on-surface min-h-screen flex flex-col font-body-base text-body-base ekg-bg overflow-hidden relative">
<!-- Top AppBar (Simplified for intent) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-gutter py-2 border-b border-outline-variant bg-void">
<div class="font-display-xl text-display-xl text-primary tracking-tighter uppercase">FLATLINE</div>
<div class="flex gap-4">
<span class="material-symbols-outlined text-on-surface-variant hover:text-primary-container transition-colors cursor-pointer" style="font-variation-settings: 'FILL' 0;">settings</span>
<span class="material-symbols-outlined text-on-surface-variant hover:text-primary-container transition-colors cursor-pointer" style="font-variation-settings: 'FILL' 0;">emergency</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col justify-center px-gutter md:px-margin-desktop pt-24 pb-24 z-10 w-full max-w-4xl mx-auto">
<!-- Timer UI -->
<div class="mb-8 w-full">
<div class="flex justify-between items-end mb-2">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Time Remaining</span>
<div class="font-timer-mono text-timer-mono text-primary animate-pulse-fast text-glow">45.00s</div>
</div>
<!-- Full width red timer bar -->
<div class="w-full h-[6px] bg-surface-container-high rounded-full overflow-hidden border border-outline-variant">
<div class="h-full bg-primary timer-bar-anim rounded-full border-glow"></div>
</div>
</div>
<!-- Condensed Scenario -->
<div class="mb-8 p-6 bg-surface-container border border-outline-variant rounded-lg relative overflow-hidden">
<!-- EKG decorative pulse line behind scenario -->
<div class="absolute inset-0 opacity-10 pointer-events-none flex items-center justify-center">
<svg height="50" preserveaspectratio="none" viewbox="0 0 1000 50" width="100%">
<path class="animate-pulse" d="M0,25 L300,25 L320,5 L340,45 L360,10 L380,35 L400,25 L1000,25" fill="none" stroke="#ffb4ab" stroke-width="2"></path>
</svg>
</div>
<h2 class="font-label-sm text-label-sm text-primary mb-2 uppercase tracking-widest relative z-10">Scenario 04</h2>
<p class="font-scenario-text text-scenario-text text-on-surface relative z-10">The elevator stops between floors. The lights go out. You hear a slow, rhythmic scratching from the roof panel.</p>
</div>
<!-- Input Area -->
<div class="flex-grow flex flex-col mb-8">
<label class="sr-only" for="survival-plan">Type your survival plan</label>
<textarea autocomplete="off" class="w-full flex-grow min-h-[200px] bg-elevated border-0 border-b-2 border-primary focus:ring-0 focus:border-primary-container text-on-surface font-timer-mono text-[20px] leading-relaxed p-6 resize-none outline-none transition-colors placeholder-on-surface-variant" id="survival-plan" placeholder="&gt; TYPE YOUR SURVIVAL PLAN..." spellcheck="false"></textarea>
</div>
<!-- Action Row -->
<div class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-auto">
<!-- Secondary Action -->
<button class="w-full sm:w-auto px-6 py-3 bg-surface-container-high text-on-surface-variant border border-outline-variant rounded-full font-label-sm text-label-sm uppercase tracking-widest hover:bg-surface-container-highest transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">phone</span>
                Call Mummy
            </button>
<!-- Primary Submit -->
<button class="w-full sm:w-auto px-12 py-4 bg-primary text-on-primary font-display-xl text-[48px] leading-none uppercase rounded border-glow hover:bg-primary-container transition-all active:scale-95 flex items-center justify-center gap-2">
                SUBMIT 
                <span class="material-symbols-outlined text-[40px] font-bold" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</main>
<!-- Navigation suppressed due to Transactional/Focused intent -->
<script>
        // Simple script to focus the textarea on load for immediate interaction
        document.addEventListener('DOMContentLoaded', () => {
            const textarea = document.getElementById('survival-plan');
            if (textarea) {
                textarea.focus();
            }
        });
    </script>
</body></html>
